# Pings the free Render backend so it doesn't sleep after 15 min idle (first visit would take ~30-60 s).
# One free Render service running 24/7 stays inside Render's 750 free hours a month.
name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 min (GitHub may run it a few minutes late)
  workflow_dispatch: {} # "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend and website
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://expense-manager-api-w7sn.onrender.com/api/assistant/status
          echo
          curl -fsS -o /dev/null --max-time 30 https://expense-manager-seven-tan.vercel.app/
