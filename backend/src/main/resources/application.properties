spring.application.name=expense-manager

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_manager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# comma-separated list of allowed browser origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5180}

# Muneem assistant (docs/ASSISTANT-SPEC.md). Free-tier keys come from the environment, or from a git-ignored
# .env file in backend/ or the repo root (KEY=value lines, see .env.example). No key = assistant off.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
app.assistant.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
app.assistant.gemini.api-key=${GEMINI_API_KEY:}
app.assistant.gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}
app.assistant.groq.base-url=https://api.groq.com/openai/v1
app.assistant.groq.api-key=${GROQ_API_KEY:}
app.assistant.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.assistant.timeout=20s
app.assistant.max-notes=30
